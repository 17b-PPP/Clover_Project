<!--
  pages/partials/purchase-receipt.html
  แม่แบบ "ใบเสร็จรับเงิน" การรับซื้อน้ำยาง
  ใช้ในหน้ารับซื้อน้ำยาง, ผลประกอบการ และประวัติการขายของสมาชิก
  JavaScript ที่เติมข้อมูล: public/js/components/purchase-receipt.js
-->
<template id="purchase-receipt-template">
  <div class="receipt">
    <div class="receipt-head">
      <div class="receipt-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 8 12 3 3 8l9 5 9-5Z"/>
          <path d="M3 8v8l9 5 9-5V8M12 13v8"/>
        </svg>
      </div>
      <h1 class="receipt-org">สหกรณ์กองทุนสวนยางบ้านบางบอนจำกัด</h1>
      <p class="receipt-title">ใบเสร็จรับเงิน</p>
      <p class="receipt-subtitle">OFFICIAL_PURCHASE_RECEIPT</p>
    </div>

    <div class="receipt-info stack-3">
      <div class="receipt-row">
        <span>เลขที่สมาชิก: <span class="receipt-code" data-slot="sellerCode"></span></span>
        <span>เลขที่: <span data-slot="receiptNumber"></span></span>
      </div>
      <div class="receipt-row">
        <span>ผู้ส่งน้ำยาง: <span data-slot="deliveredByName"></span></span>
        <span class="receipt-row-right">เจ้าของสวน: <span data-slot="ownerName"></span></span>
      </div>
      <div class="receipt-row">
        <span>วันที่: <span data-slot="date"></span></span>
        <span>เวลา: <span data-slot="time"></span></span>
      </div>
    </div>

    <div class="receipt-grid">
      <div class="receipt-box">
        <p class="receipt-box-label">น้ำหนักน้ำยางสดสุทธิ</p>
        <p class="receipt-box-value"><span data-slot="rawWeightKg"></span> กก.</p>
      </div>
      <div class="receipt-box">
        <p class="receipt-box-label">% เนื้อยาง</p>
        <p class="receipt-box-value"><span data-slot="dryPercentage"></span> %</p>
      </div>
    </div>

    <div class="receipt-line">
      <span class="receipt-box-label">น้ำหนักยางแห้งสุทธิ</span>
      <span class="receipt-line-value"><span data-slot="dryWeightKg"></span> กก.</span>
    </div>

    <div class="receipt-total">
      <span class="receipt-total-label">จำนวนเงินรวม</span>
      <span class="receipt-total-value"><span data-slot="totalAmount"></span> ฿</span>
    </div>

    <div class="receipt-grid receipt-grid--payout">
      <div class="receipt-box">
        <p class="receipt-box-label">ลูกจ้าง (จ่ายแล้ว)</p>
        <p class="receipt-box-value"><span data-slot="employeePayout"></span> ฿</p>
      </div>
      <div class="receipt-box">
        <p class="receipt-box-label">เจ้าของสวน (สะสม)</p>
        <p class="receipt-box-value"><span data-slot="ownerPayout"></span> ฿</p>
      </div>
    </div>

    <div class="receipt-signatures">
      <div>
        <div class="receipt-signature-space"></div>
        <div class="receipt-signature-line">ผู้ส่งน้ำยาง/ผู้รับเงิน</div>
      </div>
      <div>
        <div class="receipt-signature-space"></div>
        <div class="receipt-signature-line">ผู้จ่ายเงิน</div>
      </div>
    </div>

    <div class="receipt-seal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 4 6v6c0 5 3.5 8 8 10 4.5-2 8-5 8-10V6l-8-4Z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
  </div>
</template>
